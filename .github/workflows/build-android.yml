name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Ensure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.WRITE_CONTACTS" />',
              '<uses-permission android:name="android.permission.READ_SMS" />',
              '<uses-permission android:name="android.permission.SEND_SMS" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          missing = []
          for line in permissions:
              name = line.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in text:
                  missing.append(f"    {line}")

          if missing:
              text = text.replace("    <application", "\n".join(missing) + "\n\n    <application", 1)
              manifest.write_text(text)
          PY
          grep 'android.permission' "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: axynera-v0.4-demo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
