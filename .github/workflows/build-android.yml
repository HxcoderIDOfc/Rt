name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install dependencies
        run: npm install

      - name: Decode brand assets
        run: |
          mkdir -p public/assets/brand
          base64 -d public/assets/brand/axynera-navbar-logo.png.b64 > public/assets/brand/axynera-navbar-logo.png
          base64 -d public/assets/brand/axynera-splash-loading.png.b64 > public/assets/brand/axynera-splash-loading.png
          base64 -d public/assets/brand/axynera-app-icon-ax.png.b64 > public/assets/brand/axynera-app-icon-ax.png

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Ensure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.WRITE_CONTACTS" />',
              '<uses-permission android:name="android.permission.READ_SMS" />',
              '<uses-permission android:name="android.permission.SEND_SMS" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          missing = []
          for line in permissions:
              name = line.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in text:
                  missing.append(f"    {line}")

          if missing:
              text = text.replace("    <application", "\n".join(missing) + "\n\n    <application", 1)
              manifest.write_text(text)
          PY
          grep 'android.permission' "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply AX launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi
          make_icon() {
            src="$1"
            canvas="$2"
            inner="$3"
            out="$4"
            convert "$src" -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" "$out"
          }
          make_icon public/assets/brand/axynera-app-icon-ax.png 48 31 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 48 31 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 108 68 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 72 47 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 72 47 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 162 102 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 96 62 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 96 62 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 216 136 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 144 94 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 144 94 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 324 204 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 192 125 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 192 125 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          make_icon public/assets/brand/axynera-app-icon-ax.png 432 272 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Install stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          base64 -d public/signing/axynera-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: axynera-v0.11-demo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
